name: al_quran_flutter
description: A comprehensive Quran, Duas and Ziyarat Flutter application with advanced features.
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  flutter_vector_icons: ^2.0.0
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/texts/
    - assets/data/
